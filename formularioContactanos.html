<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos — Esperanza Lumina</title>
    <meta name="description"
        content="Ponte en contacto con nosotros. Estamos deseando empezar un proyecto contigo.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="main-header">
    <div class="logo">
        <img src="imagenes/flamy.svg" alt="Logo Flamy" class="logo-img" width="59" height="150">
    </div>

    <h2 class="header-title">César Cuenca</h2>

    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú de navegación" aria-expanded="false"
        aria-controls="nav-menu">
        ☰
    </button>

    <nav class="nav" id="nav-menu" aria-label="Navegación principal">
        <a href="index.html" class="botonNavegacion">¿Quién soy?</a>
        <a href="formularioContactanos.html" class="botonNavegacion">Contáctame</a>
    </nav>
</header>

    <main class="container">
        <section class="contactoPrincipalContenedor" aria-labelledby="contacto-heading">
            <div class="contacto-info">
                <h1 id="contacto-heading">Contactame</h1>
                <p>¡Estoy deseando empezar un proyecto contigo!</p>
            </div>

       
            <form
                action=""
                method="post"
                aria-label="Formulario de contacto">

                <div class="nombre">
                    <label for="txtNombre"><b>Nombre</b></label>
                    <input
                        type="text"
                        name="txtNombre"
                        id="txtNombre"
                        placeholder="Introduzca su nombre"
                        autocomplete="name"
                        required
                        aria-required="true">
                </div>

                <div class="nombre">
                    <label for="txtEmail"><b>Correo electrónico</b></label>
                    <input
                        type="email"
                        name="txtEmail"
                        id="txtEmail"
                        placeholder="Introduzca su email"
                        autocomplete="email"
                        required
                        aria-required="true">
                </div>

                <div class="mensaje">
                    <label for="txtMensaje"><b>Mensaje</b></label>
                    <textarea
                        name="txtMensaje"
                        id="txtMensaje"
                        placeholder="Introduzca el mensaje"
                        rows="8"
                        required
                        aria-required="true"></textarea>
                </div>

                <button type="submit" class="enviar">
                    <h2>Enviar</h2>
                </button>

            </form>
        </section>
    </main>
    <footer class="main-footer">
        <div class="footer-content">
            <a href="formularioContactanos.html" class="botonNavegacion">Contactame:</a>

            <div class="footer-brand">

                <p>#613246097</p>
                <p>ccuencap2526@politecnics.barcelona</p>
            </div>

            <div class="footer-socials">
                <p>Redes sociales</p>

                <div class="social-icons">
                    <a href="https://www.facebook.com/?locale=es_ES" target="_blank">
                        <img src="imagenes/facebook.svg" alt=" logo facebook">
                    </a>

                    <a href="https://www.instagram.com/" target="_blank">
                        <img src="imagenes/instagram.svg" alt="logo instagram">
                    </a>

                    <a href="">
                        <img src="imagenes/twiter.svg" alt="logo twiter">
                    </a>

                </div>
            </div>

        </div>

        <div class="final">
            <p><small>Hecho con calidez por Flamy &copy; 2026</small></p>
        </div>
    </footer>

    <script src="animacionJavaScript.js"></script>
</body>

</html>
